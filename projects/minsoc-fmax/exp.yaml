# Cache + bypass của minsoc_fmax.py (start_cache và Bypass đọc file này).
# Cache chỉ phân biệt theo _chia_tag; tag gồm hash patch (fork_state), pha và period:
#   run_gate     -> baseline_gate_<hash>
#   vivado_impl  -> baseline_fpga_<hash>_p<period>_<mem>_n<n_impl>_v<hash SimDRAM_fpga.v + vivado_tcl.py>
# Lần đầu chạy thật và ghi; lần sau đọc lại (bypass chỉ khi cache thật sự có tag, xem cache_hit_cond).
cache:
  run_gate:    {cache: true, tags: ["baseline_.*"]}
  vivado_impl: {cache: true, tags: ["baseline_.*"]}

bypass:
  run_gate:    {bypass: true, tags: ["baseline_.*"]}
  vivado_impl: {bypass: true, tags: ["baseline_.*"]}
