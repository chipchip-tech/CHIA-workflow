# CHIA cluster for projects/rocket-fmax (4 workers):
#   - hello_chipyard: build, git tree, agent tools, and Chipyard's FPGA flow of soc_bitstream.py
#     (chipyard; Vivado installed on the head under ~/tools/Xilinx, mounted read-only)
#   - hello_verilator: gate, 4 simulators at once (verilator_run)
#   - hello_claude: Claude Code, the agent (claude_creds)
#   - rocket_eda: Yosys + OpenSTA + sky130hd liberty, the loop's synth and synth_ab (eda; image
#     built locally, docker/EdaDockerfile)
#   The `vivado` worker (rocket_vivado, out-of-context RocketTile) was dropped on 04/11/2026
#   (last version: commit 2dd99af).
# Node type names match configs/cluster-local.yaml, so this is the same cluster ("default").
# The opencode worker of cluster-local.yaml is gone: after `chia up` with this file, remove its
# old container once (README, "Chuẩn bị").
#
# Before `chia up`:
#   loginctl enable-linger $USER          # once; see docs/setup-bazzite.md section 5
#   export THIS_MACHINE=$(ip route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="src") print $(i+1)}')
#   chia up projects/rocket-fmax/cluster.yaml -y

cluster_name: default

provider:
    head_ip: ${THIS_MACHINE}

auth:
    ssh_user: ${USER}
    # ssh_private_key: ~/.ssh/id_ed25519   # only if the key is not in ssh-agent

available_node_types:
    hello_chipyard:
        resources: {"chipyard": 1}
        num_workers: 1
        compatible_ips: ["${THIS_MACHINE}"]
        worker_setup_commands: ["source /home/ray/chipyard/env.sh"]
        docker:
            image: "ghcr.io/ucb-bar/chia-chisel-build:latest"
            container_name: "chia-chipyard-${USER}"
            run_options:
                - --shm-size=10.24gb
                # soc_bitstream.py: Vivado and the Digilent board files (~/tools/Xilinx/vivado-boards).
                # label=disable: SELinux on Bazzite would otherwise need a relabel (:z) of the whole tree.
                - "-v ~/tools/Xilinx:/tools/Xilinx:ro"
                - --security-opt label=disable
            pull_timeout: 7200   # chia-chisel-build is large
            pull_before_run: false   # keep the local image: a new :latest would change the build under the cache

    hello_verilator:
        resources: {"verilator_run": 4}
        num_workers: 1
        compatible_ips: ["${THIS_MACHINE}"]
        docker:
            image: "ghcr.io/ucb-bar/chia-verilator-run:latest"
            container_name: "chia-verilator-${USER}"
            pull_before_run: false
            run_options:
                - --ulimit nofile=65536:65536
                - --shm-size=10.24gb

    # The agent: Claude Code logged in on the host (`claude`, then
    # `cp ~/.claude.json ~/.claude/.claude.json`); ~/.claude is mounted read-write (token refresh).
    hello_claude:
        resources: {"claude_creds": 1}
        num_workers: 1
        compatible_ips: ["${THIS_MACHINE}"]
        docker:
            image: "ghcr.io/ucb-bar/chia-claude-code:latest"
            container_name: "chia-claude-${USER}"
            pull_before_run: false
            run_options:
                - "--user $(id -u):$(id -g)"
                - "-v ~/.claude:/home/ray/.claude:z"
            run_setup_commands:
                - echo "user:x:$(id -u):$(id -g)::/home/ray:/bin/bash" >> /etc/passwd
                - cp /home/ray/.claude/.claude.json /home/ray/.claude.json
                - python3 -c "import json,os; p=os.path.expanduser('~/.claude/settings.json'); d=json.load(open(p)) if os.path.exists(p) else {}; d['skipDangerousModePermissionPrompt']=True; json.dump(d,open(p,'w'))"

    # fmax_nodes.synth_sta: Yosys + OpenSTA + sky130hd liberty.
    rocket_eda:
        resources: {"eda": 1}
        num_workers: 1
        compatible_ips: ["${THIS_MACHINE}"]
        docker:
            image: "chia-eda-sky130:latest"
            container_name: "chia-eda-${USER}"
            pull_before_run: false   # built locally: docker build -f docker/EdaDockerfile ...
            run_options:
                - --shm-size=4gb
                - --memory=10g       # a runaway Yosys kills only this container

head_env_commands: ["source ~/.bashrc && conda activate chia_env"]
head_setup_commands: ["source ~/.bashrc && conda activate chia_env"]

# Bazzite: systemd-logind kills everything an SSH session started when that session
# closes, so the Ray head must run in its own user scope (needs `loginctl enable-linger`).
head_start_ray_commands:
    - "source ~/.bashrc && conda activate chia_env && ray stop"
    - "source ~/.bashrc && conda activate chia_env && \
        systemd-run --user --scope --quiet \
        ray start --head --port=6379 --node-ip-address=${THIS_MACHINE} \
        --include-dashboard=True --dashboard-agent-listen-port=0 --disable-usage-stats"

worker_start_ray_commands:
    - "ray stop"
    - "ray start --address=$RAY_HEAD_IP:6379 --dashboard-agent-listen-port=0"
